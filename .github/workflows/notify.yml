name: Daily Email Notifications (Gmail)
on:
  schedule:
    - cron: '0 1 * * *'   # 08:00 น. เวลาไทย (UTC+7 = UTC 01:00)
  workflow_dispatch:        # รันด้วยตนเองได้จาก GitHub Actions tab

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci && npm install firebase-admin nodemailer

      - name: Send Gmail notifications
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER:               ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:       ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/notify.js
